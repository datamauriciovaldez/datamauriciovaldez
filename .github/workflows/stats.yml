name: Refresh GitHub stats card

on:
  schedule:
    - cron: "17 5 * * *" # once a day = 24 h cache
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/github_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          EXCLUDE_REPOS: TestRepo
        run: python scripts/github_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats card"
          git push
